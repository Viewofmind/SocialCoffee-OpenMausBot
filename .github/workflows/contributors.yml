# enterprise/ is proprietary to SocialCoffee DigiTech Pvt Ltd (enterprise/LICENSE)
# and is maintained in-house: outside pull requests may not change it.
# Runs on pull_request_target so it can report on fork pull requests; it never
# checks out or executes pull-request code. Branches pushed to this repository
# need write access, so only pull requests from forks by non-members are checked.
name: contributors

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  enterprise:
    name: enterprise/ is maintained in-house
    if: >-
      ${{ github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Does this pull request touch enterprise/?
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            enterprise:
              - 'enterprise/**'
      - name: Refuse outside changes to enterprise/
        if: steps.changes.outputs.enterprise == 'true'
        run: |
          echo "::error::enterprise/ is proprietary to SocialCoffee DigiTech Pvt Ltd and does not accept outside contributions (see LICENSING.md). Changes outside enterprise/ are welcome under Apache-2.0."
          exit 1
